<div class="transaction-component">
  <div class="form-header">
    <h2>Nueva Transacción</h2>
  </div>

  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()" class="transaction-form">
    <div class="form-row">
      <div class="form-group col-full">
        <label for="name">Tipo de Transacción</label>
        <select
          class="form-select"
          id="transactionType"
          formControlName="transactionType"
          [class.is-invalid]="submitted && transactionType?.invalid"
        >
          <option value="">Seleccione una transacción</option>
          <option *ngFor="let tr of transactionTypes" [value]="tr.value">
            {{ tr.name }}
          </option>
        </select>
        <div class="invalid-feedback" *ngIf="submitted && transactionType?.invalid">
          Tipo de transacción es requerida
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-full">
        <label for="description">Producto</label>
        <select
          class="form-select"
          id="productId"
          formControlName="productId"
          (change)="setPrices($event)"
        >
          <option value="">Seleccione un producto</option>
          <option *ngFor="let pr of products" [value]="pr.id">
            {{ pr.name }}
          </option>
        </select>
        <div class="invalid-feedback" *ngIf="submitted && productId?.invalid">
          Es necesario elegir un producto
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-full">
        <label for="amount">Cantidad</label>
        <input
          type="number"
          id="amount"
          formControlName="amount"
          class="form-control"
          placeholder="0"
          min="0"
          (change)="onAmountBlur($event)"
          [ngClass]="{
            'is-invalid': amount?.invalid && amount?.touched,
          }"
        />
        <div class="error-message" *ngIf="amount?.invalid && amount?.touched">
          <span *ngIf="amount?.errors?.['required']">La cantidad es requerida</span>
          <span *ngIf="amount?.errors?.['min']">La cantidad no puede ser negativa</span>
          <span *ngIf="amount?.errors?.['pattern']">Debe ser un número entero</span>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-full">
        <label for="unitPrice">Precio Unitario</label>
        <input
          type="number"
          id="unitPrice"
          formControlName="unitPrice"
          class="form-control"
          placeholder="0.00"
          step="0.01"
          min="0"
          [disabled]="true"
          [ngClass]="{
            'is-invalid': unitPrice?.invalid && unitPrice?.touched,
          }"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-full">
        <label for="totalPrice">Precio Total</label>
        <input
          type="number"
          id="totalPrice"
          formControlName="totalPrice"
          class="form-control"
          placeholder="0.00"
          step="0.01"
          min="0"
          [disabled]="true"
          [ngClass]="{
            'is-invalid': totalPrice?.invalid && totalPrice?.touched,
          }"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-full">
        <label for="detail">Detalle</label>
        <textarea
          id="detail"
          formControlName="detail"
          rows="4"
          class="form-control"
          [ngClass]="{
            'is-invalid': detail?.invalid && detail?.touched,
          }"
        ></textarea>
        <div class="error-message" *ngIf="detail?.invalid && detail?.touched">
          <span *ngIf="detail?.errors?.['required']">El detalle es requerido</span>
          <span *ngIf="detail?.errors?.['maxlength']">Máximo 500 caracteres</span>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="transactionForm.invalid">
        Nueva Transacción
      </button>
    </div>
  </form>
</div>
